providers:
  default:
    clientKey: '%env(TYPO3_OIDC_OIDC_CLIENT_KEY)%'
    clientScopes: '%env(TYPO3_OIDC_OIDC_CLIENT_SCOPES)%'
    clientSecret: '%env(TYPO3_OIDC_OIDC_CLIENT_SECRET)%'
    enableBackendAuthentication: 1
    enableCodeVerifier: '%env(TYPO3_OIDC_ENABLE_CODE_VERIFIER)%'
    enableFrontendAuthentication: '%env(TYPO3_OIDC_ENABLE_FRONTEND_AUTHENTICATION)%'
    endpointAuthorize: '%env(TYPO3_OIDC_OIDC_ENDPOINT_AUTHORIZE)%'
    endpointLogout: '%env(TYPO3_OIDC_OIDC_ENDPOINT_LOGOUT)%'
    endpointRevoke: '%env(TYPO3_OIDC_OIDC_ENDPOINTREVOKE)%'
    endpointToken: '%env(TYPO3_OIDC_OIDC_ENDPOINT_TOKEN)%'
    endpointUserInfo: '%env(TYPO3_OIDC_OIDC_ENDPOINT_USERINFO)%'
    redirectUri: '%env(TYPO3_OIDC_OIDC_REDIRECT_URI)%'
    # new users are only created, if they are member of at least one group
    usersDefaultGroup: '1'
    # new (frontend) users are created in the first pid, backend users are looked up in pid 0
    usersStoragePids: '2,0'
    mapping:
      be_users:
        realName: '<name>'
        email: '<email>'
      fe_users:
        name: '<name>'
        email: '<email>'
